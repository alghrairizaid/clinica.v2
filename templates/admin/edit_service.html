{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Edit Service</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="form-group mb-3">
                    <label for="name"><b>Service Name</b></label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ service.name }}" required>
                </div>
                <div class="form-group mb-3">
                    <label for="description"><b>Description</b></label>
                    <textarea class="form-control" id="description" name="description" rows="3">{{ service.description }}</textarea>
                </div>
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('admin_services') }}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
