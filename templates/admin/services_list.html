{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Medical Services</h4>
            <a href="{{ url_for('add_service') }}" class="btn btn-success">Add New Service</a>
        </div>
        <div class="card-body">
            {% if services %}
            <table class="table table-bordered table-hover">
                <thead class="thead-light">
                    <tr>
                        <th>Name</th>
                        <th>Description</th>
                        <th style="width: 180px;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for service in services %}
                    <tr>
                        <td>{{ service.name }}</td>
                        <td>{{ service.description or '' }}</td>
                        <td>
                            <a href="{{ url_for('edit_service', service_id=service.id) }}" class="btn btn-sm btn-primary">Edit</a>
                            <form action="{{ url_for('delete_service', service_id=service.id) }}" method="POST" style="display:inline-block;" onsubmit="return confirm('Are you sure you want to delete this service?');">
                                <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            {% else %}
            <p>No services found.</p>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
